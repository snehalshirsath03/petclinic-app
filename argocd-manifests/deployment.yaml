apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic
  namespace: petclinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: petclinic
  template:
    metadata:
      labels:
        app: petclinic
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: petclinic
          image: 401106839558.dkr.ecr.ap-southeast-2.amazonaws.com/petclinic-app:6
          ports:
            - containerPort: 8080
